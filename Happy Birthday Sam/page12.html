<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Happy Birthday Samar ❤️</title>
    <link
    href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700&family=Cinzel+Decorative:wght@400;700;900&display=swap"
    rel="stylesheet"
>

    <link
        rel="stylesheet"
        href="page12.css"
    >
</head>

<body>

    <!-- ======================================
         PREMIUM BACKGROUND
    ======================================= -->

    <div id="particle-container"></div>

    <div id="heart-container"></div>


    <!-- ======================================
         PAGE CONTENT
    ======================================= -->

    <main class="birthday-content">


        <!-- MAIN TITLE -->

        <h1 class="birthday-title">
            HAPPY Birthday to the most Pretty Girl in the World
        </h1>


        <!-- SUBTITLE / NOTE -->

        <p class="candle-note">
            Touch and blow candles to cut the cake 🕯️
        </p>


        <!-- ==================================
             CAKE AREA
        =================================== -->

        <section class="cake-area">

            <!-- Cake -->

            <div class="cake">


                <!-- Cake writing -->

                <div class="cake-message">
                    Happy Birthday Samar
                </div>


                <!-- Candles -->

                <div class="candles">


                    <!-- Candle 1 -->

                    <div
                        class="candle"
                        data-candle="1"
                    >

                        <div class="flame">
                            🔥
                        </div>

                        <div class="candle-body"></div>

                    </div>


                    <!-- Candle 2 -->

                    <div
                        class="candle"
                        data-candle="2"
                    >

                        <div class="flame">
                            🔥
                        </div>

                        <div class="candle-body"></div>

                    </div>


                    <!-- Candle 3 -->

                    <div
                        class="candle"
                        data-candle="3"
                    >

                        <div class="flame">
                            🔥
                        </div>

                        <div class="candle-body"></div>

                    </div>

                </div>


                <!-- Cake layers -->

                <div class="cake-top"></div>

                <div class="cake-middle"></div>

                <div class="cake-bottom"></div>

            </div>

        </section>


        <!-- ==================================
             EMOTIONAL MESSAGE
             HIDDEN UNTIL ALL CANDLES OUT
        =================================== -->

        <div
            id="birthday-message"
            class="birthday-message"
        >

            <p>
               & one moree Happy Birthdayy too thee mostt mosttttt Mosttrtr Preety personnn In theee Worldd...
            </p>

        </div>


        <!-- ==================================
             FINAL SIGNATURE
        =================================== -->

        <p class="made-by">
            Made By <span>Kaif</span> for My Churail
My Choti Don ❤️
        </p>


    </main>


    <!-- PAGE 12 JAVASCRIPT -->

    <script src="page12.js"></script>

</body>

</html>
