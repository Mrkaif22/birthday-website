<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

Happy Birthday Princess ❤️

</title>

<!-- CSS -->

<link
rel="stylesheet"
href="style.css">

<!-- Google Font -->

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<!-- =========================== -->
<!-- BACKGROUND ANIMATION LAYERS -->
<!-- =========================== -->

<div id="background">

<div id="stars"></div>

<div id="sparkles"></div>

<div id="flowers"></div>

<div id="hearts"></div>

</div>

<!-- =========================== -->
<!-- MAIN CONTAINER -->
<!-- =========================== -->

<div class="container">

<div class="glass">

<!-- MAIN HEART -->

<div class="heart-area">

<div class="main-heart">

❤️

</div>

</div>

<!-- TITLE -->

<h1 class="title">

Happy Birthday

<br>

Princess

</h1>

<!-- SUB TITLE -->

<p class="subtitle">

I hope never someone give you a special gift like this...
The Password is that date when i first convess to you...❤️

</p>

<!-- PASSWORD BOX -->

<div class="password-box">

<input

type="password"

id="password"

placeholder="Enter Secret Password">

<button id="unlockBtn">
Unlock ❤️
</button>

<p id="message">

</p>

</div>

<!-- NEXT BUTTON -->

<button

id="nextButton"

onclick="nextPage()">

Click Here For Next Step 🌹

</button>

</div>

</div>

<!-- BACKGROUND MUSIC -->

<audio

id="bgMusic"

loop>

<source src="music/song.mp3" type="audio/mpeg">

</audio>

<!-- JAVASCRIPT -->

<script src="script.js"></script>

</body>
